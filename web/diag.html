<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USB diagnostics</title>
<style>
body { font-family: sans-serif; margin: 16px; background: #fff; color: #111; }
button { font-size: 1.1em; padding: 10px 14px; margin: 4px 4px 4px 0; }
#msg { padding: 8px; margin: 8px 0; min-height: 1.2em; }
#msg.hl { background: #ffe066; }
#log { white-space: pre-wrap; word-break: break-all; font-size: 12px; background: #f4f4f4; padding: 8px; height: 60vh; overflow-y: auto; }
@media (prefers-color-scheme: dark) {
	body { background: #111; color: #eee; }
	#log { background: #222; }
	#msg.hl { background: #806600; }
}
</style>
</head>
<body>
<h3>USB diagnostics (writer32mx)</h3>
<p>Keep this page open; Claude tries the USB steps one by one. Tap the page once first.</p>
<div><button id="pickUsb">Choose USB device</button><button id="pickSerial">Choose serial port</button></div>
<div id="msg"></div>
<div id="log"></div>
<script src="diag.js"></script>
</body>
</html>
