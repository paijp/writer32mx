    # -- /writer32mx/ : writer32mx browser page + relay (see web/README.md)
    # Goes inside the HTTPS server block. server.py listens on 127.0.0.1:5311
    # only while a session exists (w32ctl new starts it).
    location = /writer32mx { return 301 https://$host/writer32mx/; }
    location /writer32mx/ {
        proxy_pass http://127.0.0.1:5311;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        access_log off;
    }
